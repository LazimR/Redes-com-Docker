services:
  nginx:
    build: ./nginx
    container_name: nginx-server
    ports:
      - "8080:80"
    networks:
      redes:
        ipv4_address: 46.10.0.10

  apache:
    build: ./apache
    container_name: apache-server
    ports:
      - "8081:80"
    networks:
      redes:
        ipv4_address: 46.10.0.20

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      redes:
        ipv4_address: 46.10.0.30

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      redes:
        ipv4_address: 46.10.0.40

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      redes:
        ipv4_address: 46.10.0.50

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "-nginx.scrape-uri=http://46.10.0.10/stub_status"
    depends_on:
      - nginx
    ports:
      - "9113:9113"
    networks:
      redes:
        ipv4_address: 46.10.0.70

  apache-exporter:
    image: lusitaniae/apache-exporter
    container_name: apache-exporter
    command:
      - "--scrape_uri=http://46.10.0.20/server-status?auto"
    depends_on:
      - apache
    ports:
      - "9117:9117"
    networks:
      redes:
        ipv4_address: 46.10.0.60

  k6:
    image: grafana/k6
    container_name: k6-loadtest
    volumes:
      - ./load-test:/scripts
    entrypoint: ["/bin/sh", "-c"]
    command: ["k6 run /scripts/scenario_small.js"]
    networks:
      redes:
        ipv4_address: 46.10.0.80

networks:
  redes:
    driver: bridge
    ipam:
      config:
        - subnet: 46.10.0.0/24
