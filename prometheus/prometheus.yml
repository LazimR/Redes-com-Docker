global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['46.10.0.30:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['46.10.0.50:9100']

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['46.10.0.70:9113']

  - job_name: 'apache_exporter'
    static_configs:
      - targets: ['46.10.0.60:9117']
